<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario | InfraReport</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header><div class="wrap brand">InfraReport</div></header>
    <main class="wrap">
        <div class="heading">
            <h1>Inventario de activos</h1>
            <button id="new" type="button">Registrar activo</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <section class="panel" aria-label="Activos registrados">
            <div class="toolbar">
                <span id="count">Activos registrados</span>
                <button id="refresh" class="secondary" type="button">Actualizar lista</button>
            </div>
            <div class="table-scroll" tabindex="0" role="region" aria-label="Tabla de inventario">
                <table>
                    <thead><tr><th>Activo</th><th>Empresa</th><th>Tipo</th><th>Estado</th><th>Criticidad</th><th>Acciones</th></tr></thead>
                    <tbody id="assets"></tbody>
                </table>
            </div>
        </section>
    </main>
    <dialog id="editor" aria-labelledby="form-title">
        <form id="asset-form">
            <h2 id="form-title"></h2>
            <p>Los campos marcados con * son obligatorios.</p>
            <div class="fields">
                <label>Empresa *<input name="empresa" required></label>
                <label>Nombre *<input name="nombre" required></label>
                <label>Tipo *<select name="tipo" required></select></label>
                <label>Estado *<select name="estado" required></select></label>
                <label>Criticidad *<select name="criticidad" required></select></label>
                <label>Marca<input name="marca"></label>
                <label>Modelo<input name="modelo"></label>
                <label>Dirección IP<input name="direccion_ip"></label>
                <label class="wide">Observaciones<textarea name="observaciones" rows="3"></textarea></label>
            </div>
            <p id="form-error" role="alert"></p>
            <div class="actions">
                <button id="cancel" class="secondary" type="button">Cancelar</button>
                <button id="save" type="submit">Guardar</button>
            </div>
        </form>
    </dialog>
    <dialog id="detail" aria-labelledby="detail-title">
        <h2 id="detail-title">Detalle del activo</h2>
        <dl id="detail-fields"></dl>
        <form method="dialog" class="actions"><button class="secondary">Cerrar</button></form>
    </dialog>
</body>
</html>
